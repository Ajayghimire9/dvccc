[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "artifactguard"
version = "1.0.0"
description = "Content-addressed data and model artifact integrity service"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "httpx>=0.27,<1"]
ops = ["uvicorn[standard]>=0.30,<1"]

[project.scripts]
artifactguard = "artifactguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
